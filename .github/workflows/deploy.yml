name: Déploiement Automatique LWS

on:
  push:
    branches:
      - main # Déclenche le build à chaque push sur la branche principale

jobs:
  web-deploy:
    name: 🎉 Compilation et Transfert
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Récupération du code
        uses: actions/checkout@v4

      # 2. Installe Node.js
      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajustez selon la version de votre projet

      # 3. Installe les dépendances et build le projet React
      - name: 🛠️ Build de l'application React
        run: |
          npm ci
          npm run build
          # Génère un fichier .htaccess pour gérer le routage de l'application React
          echo "Options -MultiViews" > ./dist/.htaccess
          echo "RewriteEngine On" >> ./dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> ./dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> ./dist/.htaccess
          echo "RewriteRule ^ index.html [L]" >> ./dist/.htaccess

      # 4. Synchronise le dossier de build avec l'hébergement LWS via FTP
      - name: 📂 Transfert des fichiers vers LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # IMPORTANT : 'dist' si vous utilisez Vite, ou 'build' si vous utilisez Create React App
          local-dir: ./dist/ 
          # Optionnel : Ajoutez le dossier cible sur LWS si nécessaire (ex: ./htdocs/ ou ./)
          server-dir: ./


